name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # the @gascity/* deps live on GitHub Packages (org-internal)

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        # .npmrc reads ${NODE_AUTH_TOKEN}; the built-in GITHUB_TOKEN (packages:read)
        # can read the org-internal @gascity/* packages.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit

      - name: Verify generated registry outputs
        run: bun run generate:check

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Server and integration tests
        run: bun run test:unit

      - name: Production image smoke
        # The image's bun install also needs the GitHub Packages token; pass it as
        # a BuildKit secret (id=gh_token) so it is never baked into a layer.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build --secret id=gh_token,env=NODE_AUTH_TOKEN -t registry-ci .
          docker run --rm --entrypoint /usr/local/bin/gc registry-ci pack release hash --help >/dev/null

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:e2e

  ci-required:
    name: CI / required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: verify
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "verify failed or did not complete" >&2
            exit 1
          fi

name: image
# Build + push the registry server image to GHCR — TWO variants from one Dockerfile:
#   * standalone (REGISTRY_WEB_BASE=/)        -> :main/:sha/:latest  -> registry.gascity.com
#   * apex panel (REGISTRY_WEB_BASE=/registry/) -> :apex-* tags      -> works.gascity.com/registry/
# Both push to the SAME (repo-linked) ghcr.io/gascity/gascity-registry package. The apex
# dist emits /registry/assets/* and the server derives mountBase=/registry from it.
# The Gas City product cluster deploys these images via GitOps (Flux image automation
# rolls out the newest sortable tag); the Deployments, routing, and rollout policy live
# in the infra repo, not here. On push to main this workflow publishes; PRs build-only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Push only on branch/dispatch builds; PRs build-only to validate the Dockerfile.
      # The gascity-registry package is connected to this repo (org.opencontainers.image.source
      # below), so the per-repo GITHUB_TOKEN (packages: write) publishes it — no PAT.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sortable, immutable per-build tags (main-<epoch> + apex-main-<epoch>) so the Flux
      # ImagePolicies can auto-pin the newest build by numerical order, like the rest of the fleet.
      - id: epoch
        if: github.event_name != 'pull_request'
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gascity/gascity-registry
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-${{ steps.epoch.outputs.epoch }},enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # metadata-action sets org.opencontainers.image.source=<this repo>, which
          # links the GHCR package to the repo so the per-repo GITHUB_TOKEN can write it.
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile installs @gascity/* from GitHub Packages (.npmrc reads
          # ${NODE_AUTH_TOKEN}); pass the token as a BuildKit secret, never a layer.
          # REGISTRY_WEB_BASE defaults to "/" (the standalone registry.gascity.com build).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Surface the immutable digest so a human can pin it in the infra deploy PR.
      - if: github.event_name != 'pull_request'
        name: Pinnable digest (standalone)
        run: |
          echo "STANDALONE (registry.gascity.com) — pin in registry.yaml (registry):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ghcr.io/gascity/gascity-registry@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- Apex panel variant: same Dockerfile, REGISTRY_WEB_BASE=/registry/ so the dist
      # emits /registry/assets/* and the server derives mountBase=/registry (cookie Path,
      # OIDC redirect_uri, GH callback all become /registry-prefixed). Framed same-origin at
      # works.gascity.com/registry/. The Dockerfile's grep guard fails the build if the apex
      # assets weren't actually prefixed (catches a dropped build-arg = the asset-escape bug).
      - id: apex-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gascity/gascity-registry
          tags: |
            type=raw,value=apex-main,enable={{is_default_branch}}
            type=sha,prefix=apex-sha-,format=long,enable={{is_default_branch}}
            type=raw,value=apex-latest,enable={{is_default_branch}}
            type=raw,value=apex-main-${{ steps.epoch.outputs.epoch }},enable={{is_default_branch}}

      - id: apex-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            REGISTRY_WEB_BASE=/registry/
          tags: ${{ steps.apex-meta.outputs.tags }}
          labels: ${{ steps.apex-meta.outputs.labels }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.event_name != 'pull_request'
        name: Pinnable digest (apex)
        run: |
          echo "APEX (works.gascity.com/registry/) — pin in registry.yaml (registry-apex):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ghcr.io/gascity/gascity-registry@${{ steps.apex-build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

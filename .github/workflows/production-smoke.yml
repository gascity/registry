name: Production Smoke

# Post-deploy health of registry.gascity.com. The read job proves the served surface is up
# and Postgres-backed; the write job proves prod Postgres actually accepts writes and serves the
# read-back (today's read-only smoke would stay green even if every write failed). `promote.yml`
# gates the next promotion on the most recent run here, so a red smoke freezes further deploys
# until a human fixes prod and re-runs it. Runs on a schedule (ongoing signal) and on demand.
#
# The write probe deliberately stops at the token mint + read-back: it exercises a real prod DB
# write (users upsert + api_tokens insert) and a cross-request read, WITHOUT creating a publish
# request (which would accumulate in the staff moderation queue). It leaves only a short-lived
# (10-min) expired api_token row per run. The old `push: [production]` trigger was a Railway
# artifact; there is no production-branch deploy anymore — the registry ships via Flux.
on:
  workflow_dispatch: {}
  schedule:
    # Every ~3h at an off-peak minute.
    - cron: "23 */3 * * *"

permissions:
  contents: read

jobs:
  read-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Wait for live registry
        env:
          BASE_URL: https://registry.gascity.com
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS "$BASE_URL/health" >/tmp/registry-health \
              && curl -fsS "$BASE_URL/registry.toml" >/tmp/registry.toml \
              && curl -fsS "$BASE_URL/api/me" >/tmp/registry-me.json \
              && jq -e '.authConfigured == true and .devAuthEnabled == false and .store == "postgres"' /tmp/registry-me.json >/dev/null; then
              echo "registry.gascity.com is healthy with the postgres store"
              exit 0
            fi

            sleep 15
          done

          echo "registry.gascity.com did not become healthy before timeout" >&2
          cat /tmp/registry-health 2>/dev/null || true
          cat /tmp/registry-me.json 2>/dev/null || true
          exit 1

  write-smoke:
    # MUST be a GitHub-hosted runner: the registry rejects OIDC mints whose runner_environment
    # is not "github-hosted" (server/github-actions.ts). The blacksmith runner would 403.
    runs-on: ubuntu-latest
    needs: read-smoke
    permissions:
      id-token: write
      contents: read
    env:
      BASE_URL: https://registry.gascity.com
    steps:
      - name: Write-path probe (OIDC mint -> read-your-write)
        run: |
          set -euo pipefail

          # 1. A GitHub OIDC token bound to this repo+sha, with the audience the registry expects.
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gascity-registry" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then echo "failed to obtain OIDC token" >&2; exit 1; fi

          # The mint binds the token to this repo+commit; the pack coordinates only shape the token
          # constraints (no publish request is created), so they never touch the moderation queue.
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          commit="${GITHUB_SHA}"

          # 2. Mint a scoped publish token — a real prod Postgres write (users upsert + api_tokens insert).
          mint=$(curl -fsS -X POST "$BASE_URL/api/publish-tokens/github-actions/mint" \
            -H 'content-type: application/json' \
            -d "$(jq -n --arg t "$oidc" --arg r "$repo_url" --arg c "$commit" \
              '{oidcToken:$t, repoUrl:$r, commit:$c, packPath:".", requestedName:"registry-smoke/write-probe", requestedVersion:"0.0.0", requestedDescription:"registry prod write-path smoke"}')")
          token=$(echo "$mint" | jq -r '.access_token // empty')
          [ -n "$token" ] || { echo "mint failed: $mint" >&2; exit 1; }

          # 3. Read-your-write across a SEPARATE request: /api/me reads the token+user row back,
          #    proving the write committed and is served from the postgres store.
          me=$(curl -fsS "$BASE_URL/api/me" -H "authorization: bearer $token")
          echo "$me" | jq -e '.user != null and .store == "postgres"' >/dev/null \
            || { echo "read-your-write check failed: $me" >&2; exit 1; }
          echo "write-path smoke OK: prod postgres accepted the mint and served the read-back"

name: Update Aggregate Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  packages: read # the @gascity/* deps live on GitHub Packages (org-internal)
  pull-requests: write # the refresh lands via a PR, not a direct push to main
  actions: write # only for the built-in-token fallback, which must dispatch CI itself

jobs:
  update:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      AGGREGATE_APP_ID: ${{ secrets.AGGREGATE_APP_ID }}
    steps:
      # An App installation token is a DIFFERENT identity from GITHUB_TOKEN, so it is not
      # subject to the org policy that forbids Actions from creating pull requests — which is
      # what blocks this job today. It is also short-lived (~1h) and scoped to this repo, so
      # there is no long-lived credential to rotate. Skipped until the App secrets exist.
      - name: Mint a GitHub App installation token
        id: app-token
        if: ${{ env.AGGREGATE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGGREGATE_APP_ID }}
          private-key: ${{ secrets.AGGREGATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          # App installation token if configured, else a PAT, else the built-in token. The org
          # forbids Actions from creating pull requests, so with only the built-in token
          # `gh pr create` 409s and this job cannot complete. Either non-default identity also
          # makes the PR's own pull_request run start without the approval gate, which leaves
          # the explicit dispatch below redundant but harmless.
          token: ${{ steps.app-token.outputs.token || secrets.AGGREGATE_PUSH_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        # .npmrc reads ${NODE_AUTH_TOKEN}; the built-in GITHUB_TOKEN (packages:read)
        # can read the org-internal @gascity/* packages. Without this the install 401s.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Regenerate aggregate catalog
        run: bun run generate

      - name: Verify aggregate outputs are self-consistent
        # Offline round-trip: proves `generate` emitted canonical, mutually consistent
        # registry.toml + catalog.json + og before we commit them. No network.
        run: bun run generate:check

      - name: Open a PR with the aggregate updates and merge it on green
        # `main` requires the "CI / required" check, and a freshly pushed commit carries no
        # status, so a direct push is rejected outright (GH006). Rather than bypass protection
        # with an admin credential, the refresh goes through a normal PR that genuinely passes
        # CI — so `generate:check` actually gates the artifacts we serve.
        #
        # The one wrinkle: a PR opened by GITHUB_TOKEN gets its `pull_request` run queued in an
        # "approval required" state, which nothing would ever approve unattended. But
        # `workflow_dispatch` is a documented exception that ALWAYS creates a run, so we
        # dispatch CI on the branch ourselves. Its "CI / required" check attaches to the branch
        # head — the PR's head SHA — which is exactly what protection evaluates.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AGGREGATE_PUSH_TOKEN || github.token }}
          NON_DEFAULT_IDENTITY: ${{ steps.app-token.outputs.token && 'app' || secrets.AGGREGATE_PUSH_TOKEN && 'pat' || '' }}
        run: |
          set -euo pipefail

          if git diff --quiet -- public/registry.toml public/catalog.json public/og; then
            echo "aggregate registry already current"
            exit 0
          fi

          branch="chore/aggregate-$(date -u +%Y%m%dT%H%M%SZ)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/registry.toml public/catalog.json public/og
          git commit -m "chore: update aggregate registry"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<'BODY'
          Hourly upstream refresh of `public/registry.toml`, `public/catalog.json` and `public/og`.

          Produced by `bun run generate` and self-checked offline with `bun run generate:check`
          before this PR was opened. Merged automatically once CI is green.
          BODY
          sed -i 's/^          //' /tmp/pr-body.md

          if ! gh pr create --base main --head "$branch" \
            --title "chore: update aggregate registry" \
            --body-file /tmp/pr-body.md; then
            echo "::error::Could not open the refresh PR. If the message above says GitHub Actions is not permitted to create pull requests, add the AGGREGATE_APP_ID and AGGREGATE_APP_PRIVATE_KEY secrets for a GitHub App installed on this repo with contents + pull-requests write (this workflow mints an installation token from them automatically), or an AGGREGATE_PUSH_TOKEN PAT, or allow Actions to create pull requests at the org level. Branch $branch is pushed and holds the refresh."
            exit 1
          fi
          pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          echo "opened PR #$pr on $branch"

          # Only the built-in token needs the dispatch workaround: its PR's own run is
          # queued approval-gated and nothing would approve it unattended. An App/PAT identity
          # starts that run normally, so dispatching would just duplicate CI — and the App
          # deliberately has no Actions:write, so it could not dispatch anyway.
          if [ -n "${NON_DEFAULT_IDENTITY:-}" ]; then
            echo "non-default identity: relying on the PR's own CI run"
            if ! gh pr checks "$pr" --watch --interval 20 --fail-fast; then
              echo "::error::CI failed on the aggregate refresh; PR #$pr left open for inspection"
              exit 1
            fi
          else
            gh workflow run ci.yml --ref "$branch"
            # Watch OUR dispatched run by id: the PR also carries the approval-gated run that
            # stays action_required forever, so waiting on every check would hang.
            run_id=""
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list --workflow=ci.yml --branch "$branch" \
                --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "::error::dispatched CI run never appeared for $branch; PR #$pr left open"
              exit 1
            fi
            echo "watching dispatched CI run $run_id"
            if ! gh run watch "$run_id" --exit-status --interval 20; then
              echo "::error::CI failed on the aggregate refresh; PR #$pr left open for inspection"
              exit 1
            fi
          fi

          # A plain merge — protection is satisfied, nothing is bypassed.
          if ! gh pr merge "$pr" --squash --delete-branch; then
            echo "::error::CI passed but merging PR #$pr was refused; check branch protection"
            exit 1
          fi
          echo "merged PR #$pr"

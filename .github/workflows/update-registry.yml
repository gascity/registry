name: Update Aggregate Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate aggregate catalog
        run: bun run generate

      - name: Commit aggregate updates
        run: |
          if git diff --quiet -- public/registry.toml public/catalog.json public/og; then
            echo "aggregate registry already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry.toml public/catalog.json public/og
          git commit -m "chore: update aggregate registry"
          git push origin HEAD:main

name: Update Aggregate Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  packages: read # the @gascity/* deps live on GitHub Packages (org-internal)

jobs:
  update:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        # .npmrc reads ${NODE_AUTH_TOKEN}; the built-in GITHUB_TOKEN (packages:read)
        # can read the org-internal @gascity/* packages. Without this the install 401s.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Regenerate aggregate catalog
        run: bun run generate

      - name: Commit aggregate updates
        run: |
          if git diff --quiet -- public/registry.toml public/catalog.json public/og; then
            echo "aggregate registry already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry.toml public/catalog.json public/og
          git commit -m "chore: update aggregate registry"
          git push origin HEAD:main
